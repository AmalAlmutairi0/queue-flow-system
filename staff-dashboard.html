<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <article class="staff" id="staff-section">
            <section class="staff-dashboard">
                <h2>Staff Control Dashboard</h2>

                <div class="now-serving-box">
                    <span class="label">Currently Serving</span>
                    <h2 class="staff-current-ticket">A-098</h2>
                    <p class="staff-current-service">Schedule Change</p>
                </div>

                <button id="call-next-btn" class="call-next-btn">
                    <i class="fa-solid fa-bullhorn"></i> Call Next Student
                </button>

                <div class="waiting-queue-overview">
                    <h3>Waiting Queue (<span class="queue-count">3</span>)</h3>
                    <ul class="queue-list">
                        <li class="queue-item">
                            <span class="ticket-id">A-099</span>
                            <span class="service-type">Certificate</span>
                        </li>
                        <li class="queue-item">
                            <span class="ticket-id">A-100</span>
                            <span class="service-type">Academic Advising</span>
                        </li>
                        <li class="queue-item">
                            <span class="ticket-id">A-101</span>
                            <span class="service-type">Schedule Change</span>
                        </li>
                    </ul>
                </div>
            </section>
        </article>
</body>
</html>
