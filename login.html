<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Smart Queue</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    <header class="header">
        <div class="logo-container">
            <i class="fa-solid fa-burst"></i>
            <span>QueueFlow</span>
        </div>
        <i class="fa-solid fa-bars nav-toggle"></i>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="login.html">Login</a></li>
            <li><a href="register.html">Register</a></li>
        </ul>
    </header>

    <main class="content">
        <a href="index.html" class="back-link">
            <i class="fa-solid fa-arrow-left"></i>
            <span>Back</span>
        </a>

        <div class="description">
            <i class="fa-solid fa-right-to-bracket"></i>
            <h1>Welcome Back</h1>
            <p>Select your portal to log in to Queue Flow System</p>
        </div>

        <section class="form-section">
            <p class="role-label">Login as:</p>
            <div class="role-selector">
                <button type="button" class="role-btn active" id="btn-student">
                    <i class="fa-solid fa-graduation-cap"></i>
                    <h3>Student</h3>
                </button>
                <button type="button" class="role-btn" id="btn-staff">
                    <i class="fa-solid fa-id-card"></i>
                    <h3>Staff</h3>
                </button>
            </div>

            <form class="auth-form" id="login-form">
                <div class="input-group">
                    <label for="email" id="email-label">Student Email / ID</label>
                    <input type="text" id="email" placeholder="student@psu.edu.sa" required>
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>

                <div class="form-options">
                    <div class="checkbox-group">
                        <input type="checkbox" id="remember">
                        <label for="remember">Remember me</label>
                    </div>
                    <a href="#" class="forgot-pass-link">Forgot Password?</a>
                </div>

                <button type="submit" class="create-btn">Log In</button>
            </form>

            <div class="form-footer">
                <p>Don't have an account? <a href="register.html">Sign Up</a></p>
            </div>
        </section>
    </main>

    <script src="js/login.js"></script>
</body>
</html>
